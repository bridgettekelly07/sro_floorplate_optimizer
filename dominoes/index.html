<style>
  :root { --bg:#E9E2D6; --slate:#3D5A6C; --coral:#E0724E; --ink:#2B3A42; --muted:#5F6E78; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Helvetica, Arial, sans-serif; }
  #track { max-width:1600px; margin:0 auto; }
  #track svg { width:100%; height:auto; display:block; }
  #track g.callout[data-levers]:not([data-levers=""]) { cursor:pointer; }
  #track g.callout[data-levers]:not([data-levers=""]):hover rect { stroke:var(--coral); }
  #track g.callout.on rect { stroke:var(--coral); stroke-width:1.6; stroke-dasharray:none; }
  #track g.det { cursor:pointer; }
  #track g.det:hover circle.dot { stroke:var(--coral); stroke-width:2; }
  #track g.det.sel circle.dot { fill:var(--coral); stroke:var(--coral); }
  #track g.stage circle { transition:stroke .15s; }
  #track.has-run g.stage:not(.lit) { opacity:.4; }
  #track g.stage.lit circle { stroke:var(--coral); stroke-width:4; }
  #track text.axis.gap { font-style:italic; }
  #track text.axis.on { fill:var(--coral); font-weight:bold; }
  #track path.bypass { transition:stroke-width .15s; }
  #track.bypass-on path.bypass { stroke-width:2.4; }
  #track.bypass-on g.stage[data-stage="Council"] { opacity:.3; }
  #track.bypass-on text.axis[data-stage="Council"] { text-decoration:line-through; }
  #track polygon.dia { transition:transform .15s; transform-box:fill-box; transform-origin:center; }
  #track.has-run polygon.dia:not(.on) { opacity:.3; }
  #track polygon.dia.on { transform:scale(1.5); stroke-width:2; }
  #track polygon.dia.effect.on { fill:var(--coral); fill-opacity:.35; }
  #track .count { font-size:11px; font-weight:bold; fill:var(--coral); }
  #effects { max-width:1600px; margin:0 auto; }
  #effects svg { width:100%; height:auto; display:block; }
</style>

const GRAPH = {"meta": {"title": "SRO conversion claim graph, Downtown Eastside Vancouver", "version": "0.6", "date": "2026-10-17", "unit": "A domino is an edge: a sourced claim that one decision option or outcome moves another outcome, with a direction and a lag in years.", "rules": {"direction": "+ raises the outcome, - lowers it, 0 holds it steady", "lag": "years after the decision takes effect; effect lands at t + lag_min and persists through lag_max", "evidence": "applies to observation edges only. strong = peer-reviewed quantitative; moderate = peer-reviewed qualitative, or an official longitudinal data series; weak = thesis, advocacy survey, or a one-off government statement. Null on mechanism and theory edges.", "geography": "vancouver = DTES or Vancouver evidence; other = evidence from elsewhere, transferability not shown", "fork": "edges sharing a fork id contradict each other and must both be shown", "stop": "a decision option with zero outgoing edges halts the run and asks for a source", "claim_type": "mechanism = follows from how the policy or arithmetic is defined, no evidence grade; observation = an empirical study measured it; theory = a peer-reviewed argument not measured in this case"}, "camps": ["economics", "geography", "planning", "health", "architecture"]}, "decisions": [{"id": "conversion_permit", "label": "SRA conversion or demolition permit", "who": "City of Vancouver, under the SRA Bylaw", "options": ["deny", "allow", "minor_repair_staff"], "note": "minor_repair_staff: since 2015, repairs that relocate a tenant but keep the room in the bylaw are approved by the Chief Housing Officer without Council. Most renovation cases take this route."}, {"id": "replacement_ratio", "label": "Replacement of lost rooms", "who": "City condition on the permit", "options": ["one_to_one", "partial", "none"]}, {"id": "unit_size_sf", "label": "Minimum unit size in square feet", "who": "City design guidelines", "options": ["100", "200", "250", "320"], "note": "20  "geography": "vancouver", "source": "fleming_2019"}, {"id": "e03", "claim_type": "mechanism", "from": "unit_size_sf=250", "to": "units_per_building", "direction": "-", "lag_min": 0, "lag_max": 0, "camp": "architecture", "evidence": null, "geography": "vancouver", "source": "cov_d016_2014", "note": "Inference: typical SRA room is about 100 sf, so a 250 sf unit merges rooms. Guideline says it aims to minimize unit loss."}, {"id": "e04", "claim_type": "mechanism", "from": "unit_size_sf=320", "to": "units_per_building", "direction": "-", "lag_min": 0, "lag_max": 0, "camp": "architecture", "evidence": null, "geography": "vancouver", "source": "cov_sra_bylaw", "note": "320 sf is the SRA threshold; above it a unit leaves the bylaw's definition."}, {"id": "e05", "claim_type": "mechanism", "from": "unit_size_sf=320", "to": "floor_area_per_tenant", "direction": "+", "lag_min": 0, "lag_max": 0, "camp": "architecture", "evidence": null, "geography": "vancouver", "source": "cov_sra_bylaw", "note": "Arithmetic from the option, not a finding."}, {"id": "e06", "claim_type": "observation", "from": "floor_area_per_tenant", "to": "space_wellbeing", "direction": "+", "lag_min": 0, "lag_max": 2, "camp": "architecture", "evidence": "strong", "geography": "other", "source": "foye_2017", "note": "General population, UK panel data. Effect partly relative to peers, not absolute."}, {"id": "e07", "claim_type": "observation", "from": "units_per_building", "to": "tenant_evictions", "direction": "-", "lag_min": 0, "lag_max": 1, "camp": "health", "evidence": "moderate", "geography": "vancouver", "source": "fleming_2019", "note": "Fewer units means fewer tenants can return after renovation. Direction is negative because the edge reads: units down, evictions up."}, {"id": "e08", "claim_type": "observation", "from": "tenant_evictions", "to": "violence_exposure", "direction": "+", "lag_min": 0, "lag_max": 1, "camp": "health", "evidence": "strong", "geography": "vancouver", "source": "kennedy_2017"}, {"id": "e09", "claim_type": "observation", "from": "tenant_evictions", "to": "treatment_disruption", "direction": "+", "lag_min": 0, "lag_max": 1, "camp": "health", "evidence": "strong", "geography": "vancouver", "source": "bccsu_eviction_hiv"}, {"id": "e10", "claim_type": "theory", "from": "treatment_disruption", "to": "mortality_risk", "direction": "+", "lag_min": 0, "lag_max": 3, "camp": "health", "evidence": null, "geography": "vancouver", "source": "honer_2017", "note": "Honer finds illness-specific care has little effect on multimorbidity; disruption of that care on a high-SMR baseline is the inferred link."}, {"id": "e11", "claim_type": "mechanism", "from": "replacement_ratio=partial", "to": "new_market_units", "direction": "+", "lag_min": 1, "lag_max": 3, "camp": "economics", "evidence": null, "geography": "vancouver", "source": "cov_lap_memo_2014", "note": "Partial replacement frees floor area for market rental under the 60/40 rule. Needs an observation edge showing conversions actually produced market units; source hunt pending."}, {"id": "e12", "claim_type": "observation", "from": "new_market_units", "to": "vacancy_chain_moves", "direction": "+", "lag_min": 0, "lag_max": 5, "camp": "economics", "evidence": "strong", "geography": "other", "source": "mast_2023", "fork": "f1", "note": "100 new units lead 45 to 70 people out of below-median tracts within five years. US cities; chains below the SRO tier not observed."}, {"id": "e13", "claim_type": "observation", "from": "vacancy_chain_moves", "to": "nearby_low_income_rents", "direction": "-", "lag_min": 0, "lag_max": 5, "camp": "economics", "evidence": "strong", "geography": "other", "source": "asquith_mast_reed_2023", "note": "5 to 7 percent relative rent decline near large new buildings in low-income areas."}, {"id": "e14", "claim_type": "theory", "from": "new_market_units", "to": "rent_gap_pressure", "direction": "+", "lag_min": 2, "lag_max": 10, "camp": "geography", "evidence": null, "geography": "other", "source": "smith_1979", "fork": "f1", "note": "Rival to e12. Investment signals closing of the rent gap and draws further capital."}, {"id": "e15", "claim_type": "observation", "from": "rent_gap_pressure", "to": "displacement", "direction": "+", "lag_min": 5, "lag_max": 15, "camp": "geography", "evidence": "moderate", "geography": "vancouver", "source": "burnett_2014", "note": "Burnett shows the DTES rent gap closing through commercial and consumption change first."}, {"id": "e16", "claim_type": "observation", "from": "tenure=nonprofit", "to": "gentrification_pace", "direction": "-", "lag_min": 0, "lag_max": 10, "camp": "geography", "evidence": "moderate", "geography": "vancouver", "source": "ley_dobson_2008", "fork": "f2", "note": "Concentrated non-market stock is one of Ley and Dobson's impediments."}, {"id": "e17", "claim_type": "theory", "from": "income_mix=60_40", "to": "gentrification_pace", "direction": "+", "lag_min": 2, "lag_max": 10, "camp": "planning", "evidence": null, "geography": "other", "source": "lees_2008", "fork": "f2", "note": "Social mix as state-led gentrification. Theory, UK and US cases."}, {"id": "e18", "claim_type": "observation", "from": "income_mix=60_40", "to": "social_polarization", "direction": "+", "lag_min": 1, "lag_max": 3, "camp": "planning", "evidence": "weak", "geography": "vancouver", "source": "edelman_2019", "note": "MSW thesis, qualitative, three years after the LAP."}, {"id": "e19", "claim_type": "observation", "from": "income_mix=60_40", "to": "displacement", "direction": "+", "lag_min": 1, "lag_max": 3, "camp": "planning", "evidence": "weak", "geography": "vancouver", "source": "edelman_2019"}, {"id": "e20", "claim_type": "observation", "from": "income_mix=60_40", "to": "community_ties", "direction": "0", "lag_min": 1, "lag_max": 3, "camp": "planning", "evidence": "weak", "geography": "vancouver", "source": "edelman_2019", "fork": "f3", "note": "Ties persisted despite mix. Rival to e21."}, {"id": "e21", "claim_type": "theory", "from": "income_mix=60_40", "to": "community_ties", "direction": "+", "lag_min": 3, "lag_max": 10, "camp": "planning", "evidence": null, "geography": "other", "source": "rose_2004", "fork": "f3", "note": "Montreal. Mix can build cross-class ties under some conditions."}, {"id": "e22", "claim_type": "observation", "from": "rent_at_turnover=market", "to": "sro_rent", "direction": "+", "lag_min": 0, "lag_max": 2, "camp": "planning", "evidence": "moderate", "geography": "vancouver", "source": "cov_lihs_2023", "note": "Official biennial series, not peer reviewed. The 21 percent rise is between tenancies, which is the mechanism vacancy control targets. Peer-reviewed analysis of the series not found; keep looking.", "corroboration": "ccap_hotel_report"}, {"id": "e23", "claim_type": "observation", "from": "sro_rent", "to": "displacement", "direction": "+", "lag_min": 0, "lag_max": 2, "camp": "planning", "evidence": "moderate", "geography": "vancouver", "source": "cov_lihs_2023", "note": "Official biennial series, not peer reviewed. The 21 percent rise is between tenancies, which is the mechanism vacancy control targets. Peer-reviewed analysis of the series not found; keep looking.", "corroboration": "ccap_hotel_report"}, {"id": "e24", "claim_type": "observation", "from": "conversion_permit=minor_repair_staff", "to": "tenant_evictions", "direction": "+", "lag_min": 0, "lag_max": 1, "camp": "health", "evidence": "moderate", "geography": "vancouver", "source": "fleming_2019", "note": "Relocation during repair is the eviction pathway Fleming describes. Confirm the paper covers staff-route relocations specifically."}, {"id": "e25", "claim_type": "mechanism", "from": "conversion_fee=charged", "to": "replacement_reserve", "direction": "+", "lag_min": 0, "lag_max": 0, "camp": "planning", "evidence": null, "geography": "vancouver", "source": "cov_council_2003_2015_2020", "fork": "f4", "note": "Bylaw directs the charge into a reserve earmarked for replacement housing."}, {"id": // ---- run: load, check, traverse by lag (port of run.py; nothing here adds an edge, sets a lag or picks a source)
const SIGN = {"+":1,"-":-1,"0":0};
class Stop extends Error {}
function checkSource(e) {
  if (!e.source || !(e.source in GRAPH.sources)) throw new Stop(`Edge ${e.id} has no source listed in edges.json.`);
  if (e.source === "timing_json_cases" && !(TIMING.cases && TIMING.cases.length)) throw new Stop(`Edge ${e.id} cites timing.json but it has no cases.`);
}
function traverse(option) {
  const events = [], queue = [[option, 0, 0, [], 1]];
  while (queue.length) {
    const [node, yMin, yMax, path, sign] = queue.shift();
    for (const e of GRAPH.edges) {
      if (e.from !== node || path.includes(e.id)) continue;
      checkSource(e);
      const net = sign * SIGN[e.direction];
      const emin = yMin + e.lag_min, emax = yMax + e.lag_max;
      events.push({ edge: e.id, to: e.to, net, fork: e.fork || null, claim: e.claim_type, source: e.source, camp: e.camp, year_min: emin, year_max: emax });
      if (net !== 0) queue.push([e.to, emin, emax, [...path, e.id], net]);
    }
  }
  return events;
}
// the stages an option's sourced effects reach; an option with no sourced edge reaches nothing and says so
function run(option) {
  if (!GRAPH.edges.some(e => e.from === option)) return [];
  const lever = option.split("=")[0];
  return traverse(option).map(ev => ({ ...ev, lever, option: option.split("=")[1] }));
}

function nowLine() {
  const bits = Object.entries(state.sel).map(([lev, opt]) => {
    const r = TRACKMAP.range[lev];
    if (!r.now) return null;
    const name = TRACKMAP.decision_timing[lev].title.toLowerCase();
    return opt === r.now ? `${name}: ${optText(lev, opt)} is in force now (${r.now_basis})` : `${name}: in force now ${optText(lev, r.now)}, changed to ${optText(lev, opt)}`;
  }).filter(Boolean);
  return bits.length ? bits.join("; ") + ". " : "";
}
const wrapText = (s, n) => { const out = []; let cur = ""; for (const w of s.split(/\s+/)) { if ((cur + " " + w).trim().length > n) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); } if (cur) out.push(cur); return out; };
function renderEffects() {
  const box = $("effects"), W = 1600, X0 = 250, X1 = 1500, YMIN = -10, YMAX = 30;
  const X = y => X0 + (y - YMIN) / (YMAX - YMIN) * (X1 - X0);
  const labels = Object.fromEntries(GRAPH.outcomes.map(o => [o.id, o.label]));
  const chosen = Object.entries(state.sel);
  const head = (t1, t2, h, col) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h}" font-family="Helvetica, Arial, sans-serif" fill="${INK}"><defs><pattern id="hcor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${CORAL}" fill-opacity=".1"/><line x1="0" y1="0" x2="0" y2="6" stroke="${CORAL}" stroke-width="1.4"/></pattern><pattern id="hsl" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${SLATE}" fill-opacity=".1"/><line x1="0" y1="0" x2="0" y2="6" stroke="${SLATE}" stroke-width="1.4"/></pattern></defs><rect width="${W}" height="${h}" fill="${BG}"/><text x="40" y="44" font-size="16" font-weight="bold">${esc(t1)}</text>${wrapText(t2, 170).map((ln, i) => `<text x="40" y="${68 + i * 18}" font-size="13" fill="${col || MUTED}">${esc(ln)}</text>`).join("")}`;
  if (!chosen.length) { box.innerHTML = head("Who is affected, and when", "Choose one or more decisions on the sheet above. Each effect appears under the group it lands on, at the years the evidence says it lands.", 100) + "</svg>"; return; }
  const title = chosen.map(([l, o]) => `${TRACKMAP.decision_timing[l].title.toLowerCase()}: ${optText(l, o)}`).join("  +  ");
  const LANES = [["T", "TENANTS"], ["N", "NEIGHBOURHOOD"], ["C", "CITY AND OWNERS"], ["B", "BUILDINGS"]], RH = chosen.length > 1 ? 58 : 44, PAD = 10;
  const lanes = LANES.map(([k, name]) => ({ k, name, evs: events.filter(e => TRACKMAP.outcome_who[e.to] === k).sort((a, b) => a.year_min - b.year_min || (labels[a.to] < labels[b.to] ? -1 : 1)) })).filter(l => l.evs.length);
  const sub = `${nowLine()}${events.length} sourced effects, by who they land on.${chosen.length > 1 ? " Each decision's chain is drawn on its own; the sources do not say how decisions interact." : ""} A size is shown only where a source states one.`, TOP = 84 + 18 * wrapText(sub, 170).length, h = TOP + lanes.reduce((s, l) => s + l.evs.length * RH + 2 * PAD + 8, 0) + 90;
  const multi = chosen.length > 1;
  const o = [head(title, sub, h)];
  let y = TOP;
  for (const l of lanes) {
    const bh = l.evs.length * RH + 2 * PAD;
    o.push(`<rect x="40" y="${y}" width="${X1 + 60 - 40}" height="${bh}" fill="${SLATE}" fill-opacity="${l.k === "T" || l.k === "C" ? 0.07 : 0.03}"/><text x="52" y="${y + 26}" font-size="11" font-weight="bold" letter-spacing="1.5" fill="${SLATE}">${l.name}</text>`);
    l.evs.forEach((e, i) => {
      const cy = y + PAD + i * RH + RH / 2, net = e.net, col = net > 0 ? CORAL : net < 0 ? SLATE : MUTED;
      const a0 = X(Math.max(YMIN, e.year_min)), b0 = X(Math.min(YMAX, e.year_max)), a = e.year_min === e.year_max ? a0 - 9 : a0, b = e.year_min === e.year_max ? a0 + 9 : Math.max(b0, a0 + 8);
      const obs = e.claim === "observation", fill = net === 0 ? "none" : obs ? col : `url(#${net > 0 ? "hcor" : "hsl"})`;
      const clash = events.some(x => x.to === e.to && x.net !== e.net);
      o.push(`<rect x="${a}" y="${cy - 9}" width="${b - a}" height="18" rx="9" fill="${fill}" fill-opacity="${obs ? 0.85 : 1}" stroke="${col}" stroke-width="1.6"${net === 0 ? ' stroke-dasharray="4 3"' : ""}><title>${esc(`${e.edge}, ${e.source}, ${e.claim}, years ${e.year_min} to ${e.year_max}`)}</title></rect>`);
      const q = QUOTES.quotes[e.edge], via = multi ? `   via ${TRACKMAP.decision_timing[e.lever].title.toLowerCase()} ${optText(e.lever, e.option)}` : "";
      const l1 = `${GLYPH[String(net)]} ${labels[e.to]}`, l2 = (q ? `${q.size} (${q.where})` : "size not stated") + via;
      const l2s = wrapText(l2, 64), w = Math.max(l1.length * 7.4 + 90, Math.max(...l2s.map(s => s.length)) * 6.3) + 24, right = b + 12, onRight = right + w <= X1 + 60, tx = onRight ? right : a - 12, anc = onRight ? "start" : "end";
      const flag = e.fork || clash ? `<tspan fill="${CORAL}" font-style="italic">  disputed${e.fork ? ` (${e.fork})` : ""}</tspan>` : "";
      o.push(`<text x="${tx}" y="${cy - (l2s.length > 1 ? 10 : 3)}" text-anchor="${anc}" font-size="13">${esc(l1)}${flag}</text>`);
      l2s.forEach((ln, k) => o.push(`<text x="${tx}" y="${cy + (l2s.length > 1 ? 4 : 12) + k * 13}" text-anchor="${anc}" font-size="11.5" ${q ? `fill="${INK}"` : `fill="${MUTED}" font-style="italic"`}>${esc(ln)}</text>`));
    });
    y += bh + 8;
  }
  const pb = y;
  for (let yr = YMIN; yr <= YMAX; yr += 5) {
    o.push(`<line x1="${X(yr)}" y1="${TOP}" x2="${X(yr)}" y2="${pb - 8}" stroke="${SLATE}" stroke-opacity="${yr === 0 ? 0 : 0.14}"/><text x="${X(yr)}" y="${pb + 14}" text-anchor="middle" font-size="11" fill="${MUTED}">${yr}</text>`);
  }
  o.push(`<text x="${(X0 + X1) / 2}" y="${pb + 32}" text-anchor="middle" font-size="11" fill="${MUTED}">years after the decision</text>`);
  const x0 = X(0);
  o.push(`<line x1="${x0}" y1="${TOP - 10}" x2="${x0}" y2="${pb - 8}" stroke="${INK}" stroke-width="1.5"/><text x="${x0 + 6}" y="${TOP - 14}" font-size="12" font-weight="bold">decision</text>`);
  const ly = pb + 62;
  o.push(`<g font-size="11.5"><rect x="${X0}" y="${ly - 10}" width="24" height="12" rx="6" fill="${CORAL}" fill-opacity=".85" stroke="${CORAL}"/><text x="${X0 + 32}" y="${ly}">rises, measured</text><rect x="${X0 + 170}" y="${ly - 10}" width="24" height="12" rx="6" fill="${SLATE}" fill-opacity=".85" stroke="${SLATE}"/><text x="${X0 + 202}" y="${ly}">falls, measured</text><rect x="${X0 + 340}" y="${ly - 10}" width="24" height="12" rx="6" fill="url(#hcor)" stroke="${CORAL}" stroke-width="1.4"/><text x="${X0 + 372}" y="${ly}">hatched: follows from the rule, or argued</text><rect x="${X0 + 650}" y="${ly - 10}" width="24" height="12" rx="6" fill="none" stroke="${MUTED}" stroke-dasharray="4 3"/><text x="${X0 + 682}" y="${ly}">held steady</text><text x="${X0}" y="${ly + 22}" fill="${MUTED}">Length is when it lands. A size is quoted from its source, never computed here.</text></g>`);
  o.push("</svg>");
  box.innerHTML = o.join("");
}

// ---- the sheet: pressing a decision steps it through its settings
const $ = id => document.getElementById(id);
const SHORT = {conversion_permit:"permit", conversion_fee:"fee", unit_size_sf:"size", replacement_ratio:"replacement", tenure:"tenure", income_mix:"mix", rent_at_turnover:"rent"};
const optText = (decId, opt) => decId === "unit_size_sf" ? opt + " sf" : decId === "income_mix" ? opt.replace("_", "/") : opt.replace(/_/g, " ");
const hasEdges = (dec, opt) => GRAPH.edges.some(e => e.from === `${dec}=${opt}`);
const state = { sel: {} };      // the chosen setting of each decision, any number at once
let events = [];

function recompute() { events = Object.entries(state.sel).flatMap(([lev, opt]) => run(`${lev}=${opt}`)); }
function pick(decId, opt) {
  const dec = GRAPH.decisions.find(d => d.id === decId);
  if (opt == null) { if (state.sel[decId]) return; opt = dec.options.find(o => hasEdges(decId, o)) || dec.options[0]; }
  if (state.sel[decId] === opt) delete state.sel[decId]; else state.sel[decId] = opt;
  recompute(); update();
}

function update() {
  renderEffects();
  const tr = $("track"), chosen = Object.keys(state.sel);
  tr.querySelectorAll("g.callout").forEach(g => g.classList.toggle("on", chosen.includes(g.dataset.levers)));
  tr.querySelectorAll("g.det").forEach(d => d.classList.toggle("sel", state.sel[d.dataset.lever] === d.dataset.opt));
  const reached = new Map();   // stage -> distinct effects, an effect reached with the same direction by two decisions counts once
  for (const ev of events) {
    const st = TRACKMAP.outcome_stage[ev.to]; if (!st) continue;
    if (!reached.has(st)) reached.set(st, new Map());
    reached.get(st).set(ev.to + ":" + ev.net, ev);
  }
  tr.classList.toggle("has-run", chosen.length > 0);
  tr.querySelectorAll("g.stage").forEach(g => g.classList.toggle("lit", reached.has(g.dataset.stage)));
  const timed = new Set(chosen.map(l => TRACKMAP.decision_timing[l].stage).filter(Boolean));
  tr.querySelectorAll("text.axis").forEach(t => t.classList.toggle("on", timed.has(t.dataset.stage)));
  tr.classList.toggle("bypass-on", state.sel.conversion_permit === "minor_repair_staff");
  const readAt = new Set(chosen.map(l => TRACKMAP.lever_stage[l]));
  tr.querySelectorAll("polygon.dia.read").forEach(d => d.classList.toggle("on", readAt.has(d.dataset.stage)));
  tr.querySelectorAll("polygon.dia.effect").forEach(d => d.classList.toggle("on", reached.has(d.dataset.stage)));
  // the exact effects, written beside the stage they sit at: direction glyph, plain label, a flag where sources disagree
  tr.querySelectorAll("g.fx").forEach(t => t.remove());
  const NS = "http://www.w3.org/2000/svg", labelOf = Object.fromEntries(GRAPH.outcomes.map(o => [o.id, o.label]));
  tr.querySelectorAll("g.stage.lit").forEach(g => {
    const c = g.querySelector("circle"), cx = +c.getAttribute("cx"), cy = +c.getAttribute("cy");
    const evs = [...reached.get(g.dataset.stage).values()].sort((a, b) => a.year_min - b.year_min || (a.edge < b.edge ? -1 : 1));
    const fx = document.createElementNS(NS, "g"); fx.setAttribute("class", "fx");
    const n = evs.length, topY = cy - 36;
    evs.forEach((ev, i) => {
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", cx); t.setAttribute("y", topY - 6 - (n - 1 - i) * 13); t.setAttribute("text-anchor", "middle");
      t.setAttribute("font-size", "11"); t.setAttribute("fill", "#2B3A42");
      const sp = (txt, attrs) => { const s = document.createElementNS(NS, "tspan"); s.textContent = txt; Object.entries(attrs || {}).forEach(([k, v]) => s.setAttribute(k, v)); t.appendChild(s); };
      sp(GLYPH[String(ev.net)] + " ", { fill: "#E0724E", "font-weight": "bold" });
      sp(labelOf[ev.to]);
      if (ev.fork || events.some(x => x.to === ev.to && x.net !== ev.net)) sp("  disputed", { fill: "#E0724E", "font-style": "italic" });
      fx.appendChild(t);
    });
    g.appendChild(fx);
  });
}

$("track").addEventListener("click", ev => {
  const d = ev.target.closest("g.det");
  if (d) { pick(d.dataset.lever, d.dataset.opt); return; }
  const g = ev.target.closest("g.callout"); if (g && g.dataset.levers) pick(g.dataset.levers, null);
});
update();
</script>
