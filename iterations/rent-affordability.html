<!-- ==== the rent and affordability section ==== -->
  <div class="sec-head" hidden>
    <span class="sec-num">04</span><h2>Rent and affordability</h2>
    <span class="note">Tested against the by-law standard, not against the market</span>
  </div>

  <section class="panel" style="margin-bottom:18px" hidden>
    <div class="afford">
      <div>
        <div class="field">
          <label for="r-existing">Rent of one existing SRO room, $/month</label>
          <input type="number" id="r-existing" min="0" step="5" placeholder="you supply this">
          <span class="hint-s">From your survey, or the City&rsquo;s SRO survey for the building</span>
        </div>
        <div class="field">
          <label for="r-existing-sf">SF of that room</label>
          <input type="number" id="r-existing-sf" min="40" step="5" value="100">
        </div>
        <div class="field">
          <label for="r-income">Tenant income, $/month</label>
          <input type="number" id="r-income" min="0" step="10" value="1060">
          <span class="hint-s">Default is BC income assistance for a single person: $560 support + $500 shelter</span>
        </div>
        <div class="field">
          <label for="r-unit-sf">Converted unit SF</label>
          <input type="number" id="r-unit-sf" min="60" step="5" value="200">
          <span class="hint-s" id="r-unit-src"></span>
        </div>
      </div>
      <div id="afford-out"></div>
    </div>
  </section>
