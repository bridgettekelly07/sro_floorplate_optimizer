<!-- ==== section 05, the unit breakdown generator ==== -->
  <div class="sec-head" hidden>
    <span class="sec-num">05</span><h2>Unit breakdown</h2>
    <span class="note">Generates the floorplate above</span>
  </div>

  <section class="panel" style="margin-bottom:18px" hidden>
    <div class="cols" style="grid-template-columns:minmax(0,300px) minmax(0,1fr)">
      <div>
        <div class="pair">
          <div class="field"><label for="u-count">Units per floorplate</label>
            <input type="number" id="u-count" min="1" max="60" step="1" value="10"></div>
          <div class="field"><label for="u-sf">SF per unit</label>
            <input type="number" id="u-sf" min="60" max="420" step="5" value="100"></div>
        </div>
        <div class="field">
          <label for="u-circ">Circulation and services (% of floorplate)</label>
          <input type="number" id="u-circ" min="0" max="60" step="1" value="25">
        </div>
        <div class="pair">
          <div class="field"><label for="u-floors">Floors</label>
            <input type="number" id="u-floors" min="1" max="20" step="1" value="1"></div>
          <div class="field"><label for="u-ten">Tenancy (years)</label>
            <input type="number" id="u-ten" min="0" step="0.5" value="5"></div>
        </div>
        <div class="btnrow">
          <button type="button" id="u-apply">Generate floorplate</button>
        </div>
        <p class="src">Replaces the rooms in the model above. Each room is then movable
          individually &mdash; this only sets the starting condition.</p>
      </div>
      <div>
        <div class="tally" id="u-tally"></div>
        <p class="note" id="u-note"></p>
      </div>
    </div>
  </section>
